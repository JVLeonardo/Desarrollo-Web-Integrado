spring.application.name=reusotech-api-test

# In-Memory H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:reusotech_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Security
app.jwt.secret=reusotech_secret_key_reusotech_secret_key_32bytes_min
app.jwt.expiration-ms=86400000
