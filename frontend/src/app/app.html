@if (showShell()) {
  <div class="app-layout d-flex min-vh-100">
    <app-sidebar
      [isOpen]="sidebarOpen()"
      (closeSidebar)="sidebarOpen.set(false)"
    ></app-sidebar>

    @if (sidebarOpen()) {
      <div
        class="sidebar-backdrop d-lg-none"
        (click)="sidebarOpen.set(false)"
      ></div>
    }

    <div class="main-workspace flex-grow-1 d-flex flex-column min-w-0">
      <app-navbar (toggleSidebar)="sidebarOpen.set(!sidebarOpen())"></app-navbar>

      <main class="flex-grow-1">
        <router-outlet></router-outlet>
      </main>

      <footer class="px-4 py-3 border-top d-flex flex-wrap justify-content-between gap-2">
        <span>ReusoTech Circular · Trazabilidad de activos tecnológicos</span>
        <span>Angular · Spring Boot · PostgreSQL</span>
      </footer>
    </div>
  </div>
} @else {
  <router-outlet></router-outlet>
}
